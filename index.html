<!DOCTYPE html>
<html lang="zh-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>地圖自動辨識V7.13 - 桃太郎電鐵地圖數據導出編輯器</title>
<style>
/* 全域基礎設定：預設字體 20px */
:root { --base-font-size: 20px; }
body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    padding: 14px; 
    background: #0f172a; 
    color: #f8fafc; 
    font-size: var(--base-font-size); 
    user-select: none; 
    -webkit-user-select: none; 
    text-align: left;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    box-sizing: border-box;
}

.box { 
    background: #1e293b; 
    padding: 16px; 
    border-radius: 8px; 
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); 
    margin-bottom: 14px; 
    border: 1px solid #334155; 
    text-align: left;
}

.box.flex-fill {
    display: flex;
    flex-direction: column;
    flex: 1;
    margin-bottom: 0;
}

.row { 
    display: flex; 
    gap: 12px; 
    align-items: center; 
    flex-wrap: wrap; 
    margin-bottom: 12px; 
    text-align: left;
}

.btn { 
    padding: calc(var(--base-font-size) * 0.4) calc(var(--base-font-size) * 0.8); 
    font-size: var(--base-font-size); 
    border: none; 
    border-radius: 6px; 
    cursor: pointer; 
    font-weight: bold; 
    touch-action: manipulation; 
    transition: background 0.2s, transform 0.1s; 
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.98); }

.mode-btn {
    background: #334155;
    color: #cbd5e1;
    border: 1px solid #475569;
}
.mode-btn.active {
    background: #f59e0b;
    color: #0f172a;
    border-color: #f59e0b;
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
    font-weight: bold;
}

.file-upload-btn {
    display: block;
    width: 100%;
    padding: calc(var(--base-font-size) * 0.6) calc(var(--base-font-size) * 0.8);
    background: #334155;
    color: #34d399;
    border: 1px dashed #059669;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    text-align: left;
    box-sizing: border-box;
    font-size: var(--base-font-size);
    transition: all 0.2s;
}
.file-upload-btn:hover {
    background: #065f46;
    border-color: #34d399;
    color: #fff;
}

.section-header { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    margin-bottom: 10px; 
    flex-wrap: wrap; 
    text-align: left;
}

h2, h3 { 
    margin: 0; 
    font-size: calc(var(--base-font-size) * 1.1); 
    color: #38bdf8; 
    display: flex; 
    align-items: center; 
    gap: 6px; 
    text-align: left;
}

.status-tip { 
    font-size: calc(var(--base-font-size) * 0.9); 
    color: #facc15; 
    font-weight: bold; 
    background: #0f172a; 
    padding: 4px 10px; 
    border-radius: 4px; 
    border: 1px solid #334155; 
    display: inline-block; 
}

.file-status-text {
    font-size: calc(var(--base-font-size) * 0.9);
    color: #34d399 !important;
    font-weight: bold;
}

.canvas-container {
    width: 100%;
    height: 520px;
    min-height: 350px;
    flex: 1;
    overflow: hidden;
    border: 1px solid #475569;
    background: #0f172a;
    border-radius: 6px;
    position: relative;
    display: block;
    cursor: grab;
    transition: height 0.2s ease;
}
.canvas-container.panning { cursor: grabbing; }
.canvas-container.drawing { cursor: crosshair; }
.canvas-container.deleting { cursor: pointer; }
.canvas-container.editing { cursor: pointer; }

#canvasTransformTarget {
    position: absolute;
    transform-origin: top left;
    transition: transform 0.05s ease-out;
}

canvas {
    background: #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    display: block;
}

#templateList {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
    max-height: 220px;
    overflow-y: auto;
    background: #0f172a;
    padding: 10px;
    border: 1px solid #475569;
    border-radius: 6px;
}
.template-item { 
    display: inline-flex; 
    align-items: center; 
    gap: 6px; 
    background: #334155; 
    border: 1px solid #475569; 
    padding: 5px 8px; 
    border-radius: 6px; 
}
.template-item img { 
    width: 24px; 
    height: 24px; 
    object-fit: contain; 
    border: 1px solid #ccc; 
    background: #fff; 
    border-radius: 4px;
}
.color-badge { 
    width: 12px; 
    height: 12px; 
    border-radius: 50%; 
    display: inline-block; 
}

select, input[type="text"], input[type="number"] { 
    padding: 6px 10px; 
    border-radius: 4px; 
    border: 1px solid #475569; 
    font-size: var(--base-font-size); 
    background: #0f172a; 
    color: #f8fafc;
    outline: none;
}
select:focus, input:focus { border-color: #f59e0b; }

.toolbar { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    margin-bottom: 10px; 
    background: #0f172a; 
    padding: 10px 12px; 
    border-radius: 6px; 
    border: 1px solid #334155;
    flex-wrap: wrap;
    justify-content: flex-start;
}

.version-badge { 
    background: #10b981; 
    color: white; 
    padding: 2px 8px; 
    border-radius: 4px; 
    font-size: calc(var(--base-font-size) * 0.8); 
    font-weight: bold; 
}

#copyTip {
    display: inline-block;
    margin-left: 8px;
    font-size: calc(var(--base-font-size) * 0.9);
    font-weight: bold;
    color: #34d399;
    opacity: 0;
    transition: opacity 0.3s ease;
}
#copyTip.show { opacity: 1; }

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 23, 42, 0.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}
.modal-content {
    background: #1e293b;
    border: 1px solid #475569;
    padding: 20px;
    border-radius: 8px;
    width: 440px;
    max-width: 90vw;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.candidate-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
}
.candidate-card:hover { border-color: #64748b; }
.candidate-card.selected {
    border-color: #f59e0b;
    background: #334155;
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
}

.picker-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px solid #334155;
    margin-bottom: 10px;
}
.form-group { margin-bottom: 8px; }
.form-label { font-size: calc(var(--base-font-size) * 0.8); font-weight: bold; color: #cbd5e1; margin-bottom: 4px; display: block; }
.form-input {
    width: 100%;
    padding: 6px 8px;
    font-size: calc(var(--base-font-size) * 0.85);
    background: #0f172a;
    color: #f8fafc;
    border: 1px solid #475569;
    border-radius: 4px;
    outline: none;
}
.form-input:focus { border-color: #f59e0b; }

.current-attr-box {
    background: #111827;
    border: 1px solid #374151;
    padding: 6px 10px;
    border-radius: 6px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
}
.current-attr-badge {
    font-size: calc(var(--base-font-size) * 0.85);
    font-weight: bold;
    color: #ffffff;
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.2);
}
.type-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 6px;
}
.picker-t-btn {
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    padding: 6px 4px;
    font-size: calc(var(--base-font-size) * 0.8);
    font-weight: bold;
    color: #ffffff;
    cursor: pointer;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    opacity: 0.85;
}
.picker-t-btn:hover { opacity: 1; transform: translateY(-1px); }
.picker-t-btn.active {
    opacity: 1;
    border: 2px solid #ffffff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    transform: scale(1.02);
}
.action-btn-group {
    display: flex;
    gap: 6px;
    margin-top: 15px;
}
.btn-action {
    flex: 1;
    border: none;
    padding: 8px 4px;
    border-radius: 4px;
    font-size: calc(var(--base-font-size) * 0.85);
    font-weight: bold;
    cursor: pointer;
}
.btn-action:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="box" style="border-left: 4px solid #38bdf8;">
    <div class="section-header">
        <h2>桃太郎電鐵地圖數據導出編輯器 <span class="version-badge">V7.13 (縮放按鈕優化)</span></h2>
        <span id="result" class="status-tip">✨ 初始化完成，請開始上傳大地圖與圖案</span>
        
        <div style="margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <button class="btn" id="togglePanelBtn" style="background: #0284c7; color: white; padding: 6px 12px;" onclick="toggleConfigPanel()">🔼 收起設定區</button>
            <button class="btn" style="background: #e11d48; color: white; padding: 6px 12px;" onclick="resetAllWebsite()">🔄 全部重來</button>
            
            <div style="display: flex; align-items: center; gap: 6px; color: #cbd5e1; border-left: 1px solid #334155; padding-left: 12px;" onwheel="handleFontWheel(event)">
                <span>字體:</span>
                <button class="btn" style="padding: 2px 8px; background: #475569; color: white;" onclick="adjustFontSize(-2)">-</button>
                <input type="range" id="fontSizeRange" min="12" max="28" step="2" value="20" oninput="setFontSize(this.value)" style="cursor: pointer; width: 80px; accent-color: #f59e0b;" title="可在此處滾動滑鼠滾輪調整字體">
                <button class="btn" style="padding: 2px 8px; background: #475569; color: white;" onclick="adjustFontSize(2)">+</button>
                <button class="btn" style="padding: 2px 8px; background: #64748b; color: white;" onclick="resetFontSize()">預設</button>
                <span id="fontSizeDisplay" style="color: #f59e0b; font-weight: bold; min-width: 45px; text-align: center;">20px</span>
            </div>
        </div>
    </div>

    <!-- 可隱藏/展開的設定主內容區塊 -->
    <div id="collapsibleConfigContent">
        <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 12px; margin-top: 12px;">
            <div>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                    <label><b>上傳大地圖：</b></label>
                    <span id="mapFileName" class="file-status-text">尚未選擇檔案</span>
                </div>
                <label class="file-upload-btn">
                    📤 選擇大地圖檔案...
                    <input type="file" id="uploadMap" accept="image/*" style="display: none;">
                </label>
            </div>
            <div>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                    <label><b>上傳要辨識的小圖案 (可批次上傳，支援智慧關鍵字)：</b></label>
                    <span id="templatesFileName" class="file-status-text">尚未選擇檔案</span>
                </div>
                <label class="file-upload-btn">
                    📂 選擇小圖案檔案...
                    <input type="file" id="uploadTemplates" accept="image/*" multiple="" style="display: none;">
                </label>
            </div>
        </div>

        <div class="row" style="margin-top: 10px;">
            <div>
                <label><b>區域名稱：</b></label>
                <input type="text" id="regionName" value="Okinawa" style="width: 180px;" oninput="syncRegionName(this.value)">
            </div>
        </div>

        <!-- 圖塊模板與圖庫功能區塊 -->
        <div style="margin-top: 15px;">
            <div style="margin-bottom: 8px;">
                <b>圖案樣本與辨識門檻匹配度：</b>
            </div>
            
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <label style="font-weight: bold;">選擇圖庫：</label>
                    <select id="presetLibrarySelect" onchange="loadPresetLibrary(this.value)">
                        <option value="" selected="" disabled="">-- 請選擇線上圖庫包 --</option>
                        <option value="templates_1.json">桃鐵1-標準圖庫 (templates.json)</option>
                        <option value="templates_2.json">備用圖庫2 (templates_alt.json)</option>
                        <option value="templates_3.json">備用圖庫3 (templates_custom.json)</option>
                    </select>
                </div>

                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                    <button class="btn" style="background:#8b5cf6; color:white;" onclick="openKeywordModal()">⚙️ 設定智慧關鍵字</button>
                    <button class="btn" style="background:#ef4444; color:white;" onclick="clearTemplateLibrary()">🗑️ 清空</button>
                    <button class="btn" style="background:#0284c7; color:white;" onclick="exportTemplateLibrary()">💾 匯出</button>
                    
                    <label class="btn" style="background:#10b981; color:white; cursor:pointer; margin:0;">
                        📥 匯入
                        <input type="file" id="importTemplatesFile" accept=".json" style="display:none;" onchange="importTemplateLibrary(event)">
                    </label>
                </div>
            </div>

            <div id="templateList"><i style="color: #94a3b8;">尚未上傳或載入任何圖塊...</i></div>
        </div>

        <div class="row" style="margin-top: 15px;">
            <button class="btn" id="matchBtn" style="background:#059669; color:white; padding: 12px 22px;">🔍 執行自動辨識與網格編碼 (Y軸向上)</button>
            <button class="btn" style="background:#dc2626; color:white; padding: 12px 22px;" onclick="clearResults()">🧹 清除辨識結果</button>
        </div>
    </div>
</div>

<!-- 視覺化預覽與 JSON 輸出按鈕整合區 -->
<div class="box flex-fill" id="previewBox">
    <div class="section-header">
        <h3>2. 視覺化座標網格預覽檢視與數據導出</h3>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <button class="btn" style="background: #2563eb; color: white;" onclick="copyJson()">📋 複製 JSON</button>
            <button class="btn" style="background: #16a34a; color: white;" onclick="downloadJsonFile()">💾 下載 JSON</button>
            <span id="copyTip">已複製！✓</span>
        </div>
    </div>

    <!-- 工具列 -->
    <div class="toolbar">
        <div style="display: flex; align-items: center; gap: 6px;">
            <button class="btn mode-btn active" id="btnModePan" onclick="switchInteractionMode('pan')">🖱️ 檢視平移</button>
            <button class="btn mode-btn" id="btnModeDraw" onclick="switchInteractionMode('draw')">➕ 框選新增</button>
            <button class="btn mode-btn" id="btnModeEdit" onclick="switchInteractionMode('edit')">⚙️ 編輯圖塊</button>
            <button class="btn mode-btn" id="btnModeDelete" onclick="switchInteractionMode('delete')">🗑️ 刪除圖塊</button>
        </div>

        <!-- 縮放控制：加上加減按鈕，移除多餘的 z -->
        <div style="display: flex; align-items: center; gap: 6px; border-left: 1px solid #334155; padding-left: 12px;">
            <label><b>🔍 縮放：</b></label>
            <button class="btn" style="background:#475569; color:white; padding: 2px 8px;" onclick="adjustZoom(-0.1)">-</button>
            <input type="range" id="zoomRange" min="0.5" max="3.0" step="0.1" value="1.0" oninput="updateZoom(parseFloat(this.value))" style="width: 70px; accent-color: #f59e0b;">
            <button class="btn" style="background:#475569; color:white; padding: 2px 8px;" onclick="adjustZoom(0.1)">+</button>
            <span id="zoomVal" style="font-weight: bold; color: #f59e0b; min-width: 45px; text-align: center;">100%</span>
            <button class="btn" style="background:#64748b; color:white; padding: 4px 8px;" onclick="resetZoom()">重置</button>
        </div>

        <div style="display: flex; align-items: center; gap: 6px; border-left: 1px solid #334155; padding-left: 12px;">
            <label><b>🎯 篩選：</b></label>
            <select id="layerFilterSelect" onchange="drawCanvas()" style="width: auto;"><option value="all">🌐 顯示全部</option></select>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-left: auto; border-left: 1px solid #334155; padding-left: 12px; flex-wrap: wrap;">
            <span style="font-weight: bold; color: #cbd5e1;">圖層：</span>
            <label style="cursor: pointer; display: inline-flex; align-items: center; gap: 4px; background: #0f172a; padding: 4px 8px; border-radius: 4px; border: 1px solid #334155;">
                <input type="checkbox" id="layerBox" checked="" onchange="drawCanvas()" style="accent-color: #10b981; width: 16px; height: 16px; cursor: pointer;"> 🟩 外框
            </label>
            <label style="cursor: pointer; display: inline-flex; align-items: center; gap: 4px; background: #0f172a; padding: 4px 8px; border-radius: 4px; border: 1px solid #334155;">
                <input type="checkbox" id="layerAttr" onchange="drawCanvas()" style="accent-color: #10b981; width: 16px; height: 16px; cursor: pointer;"> 🏷️ 屬性
            </label>
            <label style="cursor: pointer; display: inline-flex; align-items: center; gap: 4px; background: #0f172a; padding: 4px 8px; border-radius: 4px; border: 1px solid #334155;">
                <input type="checkbox" id="layerCoord" onchange="drawCanvas()" style="accent-color: #10b981; width: 16px; height: 16px; cursor: pointer;"> 📍 座標
            </label>
        </div>
    </div>
    
    <div class="canvas-container " id="canvasContainer" onmousedown="onCanvasMouseDown(event)" onmousemove="onCanvasMouseMove(event)" onmouseup="onCanvasMouseUp(event)" onmouseleave="onCanvasMouseUp(event)" onwheel="onCanvasWheel(event)">
        <div id="canvasTransformTarget" style="transform: translate(0px, 0px) scale(1);">
            <canvas id="resultCanvas" width="300" height="150"></canvas>
            <div id="selectionBox" style="position: absolute; border: 2px dashed #f59e0b; background: rgba(245, 158, 11, 0.2); display: none; pointer-events: none;"></div>
        </div>
    </div>
</div>

<!-- ================= 彈出視窗：框選新增與前三種候選比對 ================= -->
<div id="addNodeModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #475569; padding-bottom: 8px; margin-bottom: 12px;">
            <h3 style="margin:0;">➕ 框選新增與前三大熱門匹配</h3>
            <button class="btn" style="background:#ef4444; color:white; padding: 2px 8px;" onclick="closeAddModal()">✕</button>
        </div>

        <div style="display: flex; gap: 14px; align-items: center; margin-bottom: 12px; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155;">
            <div>
                <canvas id="addCropCanvas" width="50" height="50" style="border: 2px solid #f59e0b; border-radius: 4px; background: #fff; display: block; object-fit: contain;"></canvas>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: calc(var(--base-font-size) * 0.9); color: #f59e0b; font-weight: bold;">📷 框選區域預覽</span>
                <span style="font-size: calc(var(--base-font-size) * 0.8); color: #94a3b8;">請從下方挑選最符合的圖塊（支援 0.6 門檻）</span>
            </div>
        </div>

        <div style="margin-bottom: 12px;">
            <label class="form-label" style="margin-bottom: 6px;">🎯 前三大匹配可能性（點擊可切換選取）：</label>
            <div id="candidateListContainer" style="display: flex; flex-direction: column; gap: 6px;"></div>
        </div>

        <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 10px;">
            <label><b>網格座標 (gx, gy)：</b></label>
            <input type="number" id="newNodeGxModal" value="0" style="width: 80px;">
            <input type="number" id="newNodeGyModal" value="0" style="width: 80px;">
            <span style="font-size: calc(var(--base-font-size) * 0.85); color: #facc15;">(自動 +1 推擠)</span>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid #334155; padding-top: 12px;">
            <button class="btn" style="background:#64748b; color:white;" onclick="closeAddModal()">取消</button>
            <button class="btn" style="background:#059669; color:white;" onclick="confirmAddNodeModal()">✓ 確認新增並推擠</button>
        </div>
    </div>
</div>

<!-- ================= 彈出視窗 2：精簡版刪除節點確認 ================= -->
<div id="deleteNodeModal" class="modal" style="display: none;">
    <div class="modal-content" style="border-color: #ef4444; width: 360px;">

<script>
let mapImg = null;
let templateLibrary = [];
let currentNodes = []; 
let blockedConnections = []; 
let regionNameVal = "Okinawa";
let currentZoom = 1.0;
let currentFontSize = 20;

let interactionMode = "pan"; // "pan", "draw", "edit", "delete"
let panState = { isPanning: false, startX: 0, startY: 0, panX: 0, panY: 0 };
let drawState = { isDrawing: false, startX: 0, startY: 0, endX: 0, endY: 0 };

let pendingNewNode = null;
let selectedTemplateCandidate = null; 
let hoveredNodeIndex = -1;
let selectedDeleteNodeIndex = -1;

const v61Attributes = {
    normal: { label: "🟣 車站", color: "#8e44ad", short: "車站", icon: "🟣" },
    blue: { label: "🔵 藍格", color: "#3498db", short: "藍格", icon: "🔵" },
    red: { label: "🔴 紅格", color: "#e74c3c", short: "紅格", icon: "🔴" },
    yellow: { label: "🟡 黃格", color: "#f1c40f", short: "黃格", icon: "🟡" },
    card_shop: { label: "🏪 卡片賣場", color: "#16a085", short: "賣場", icon: "🏪" },
    copy_station: { label: "🖨️ 複製車站", color: "#34495e", short: "複製", icon: "🖨️" },
    flight_station: { label: "✈️ 飛航車站", color: "#00a8ff", short: "飛航", icon: "✈️" },
    ship_station: { label: "🚢 乘船車站", color: "#1e272c", short: "乘船", icon: "🚢" },
    rail_station: { label: "🛤️ 鐵道站", color: "#27ae60", short: "鐵道", icon: "🛤️" },
    heli_station: { label: "🚁 直升機站", color: "#d35400", short: "直升", icon: "🚁" },
    reset_station: { label: "🔄 重置周遊", color: "#e67e22", short: "重置", icon: "🔄" },
    good_card: { label: "💎 好卡片車站", color: "#e84393", short: "好卡", icon: "💎" },
    bank: { label: "🏦 銀行車站", color: "#f39c12", short: "銀行", icon: "🏦" },
    special: { label: "⚙️ 特殊", color: "#95a5a6", short: "特殊", icon: "⚙️" },
    monster: { label: "👾 名產怪獸", color: "#c0392b", short: "怪獸", icon: "👾" }
};

let currentEditingNodeIndex = -1;
let tempSelectedType = 'normal';

let defaultKeywordRules = {
    good_card: "good,好卡,good_card",
    card_shop: "card,卡片,賣場",
    blue: "blue,藍",
    red: "red,紅",
    yellow: "yellow,黃",
    copy_station: "copy,複製",
    flight_station: "flight,飛航,機場",
    ship_station: "ship,乘船,港口",
    rail_station: "rail,鐵道",
    heli_station: "heli,直升機",
    reset_station: "reset,重置",
    bank: "bank,銀行",
    special: "special,特殊",
    monster: "monster,怪獸,名產"
};

let keywordRules = JSON.parse(localStorage.getItem("momotaro_keyword_rules")) || {...defaultKeywordRules};

function toggleConfigPanel() {
    let content = document.getElementById('collapsibleConfigContent');
    let btn = document.getElementById('togglePanelBtn');
    let previewBox = document.getElementById('previewBox');
    
    if (content.style.display === 'none') {
        content.style.display = 'block';
        btn.innerText = '🔼 收起設定區';
        previewBox.style.height = 'auto';
    } else {
        content.style.display = 'none';
        btn.innerText = '🔽 展開設定區';
        previewBox.style.height = 'calc(100vh - 80px)';
    }
}

function autoDetectAttribute(filename) {
    let lower = filename.toLowerCase();
    for (let [attr, keywordsStr] of Object.entries(keywordRules)) {
        let keywords = keywordsStr.split(',').map(k => k.trim().toLowerCase());
        if (keywords.some(kw => kw && lower.includes(kw))) return attr;
    }
    return "normal";
}

function setFontSize(size) {
    currentFontSize = parseInt(size);
    if (currentFontSize < 12) currentFontSize = 12;
    if (currentFontSize > 28) currentFontSize = 28;
    document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
    let rangeEl = document.getElementById('fontSizeRange');
    let dispEl = document.getElementById('fontSizeDisplay');
    if (rangeEl) rangeEl.value = currentFontSize;
    if (dispEl) dispEl.innerText = currentFontSize + 'px';
}
function handleFontWheel(event) {
    event.preventDefault();
    setFontSize(currentFontSize + (event.deltaY < 0 ? 2 : -2));
}
function adjustFontSize(delta) { setFontSize(currentFontSize + delta); }
function resetFontSize() { setFontSize(20); }

function switchInteractionMode(mode) {
    interactionMode = mode;
    document.getElementById('btnModePan').classList.toggle('active', mode === 'pan');
    document.getElementById('btnModeDraw').classList.toggle('active', mode === 'draw');
    let editBtn = document.getElementById('btnModeEdit');
    if (editBtn) editBtn.classList.toggle('active', mode === 'edit');
    document.getElementById('btnModeDelete').classList.toggle('active', mode === 'delete');

    let container = document.getElementById('canvasContainer');
    container.className = "canvas-container " + (mode === 'pan' ? '' : (mode === 'draw' ? 'drawing' : (mode === 'edit' ? 'editing' : 'deleting')));

    closeAddModal();
    closeDeleteModal();
    closeNodeEditModal();
    drawCanvas();
}

function updateFilterOptions() {
    let select = document.getElementById('layerFilterSelect');
    let currentVal = select.value;
    let html = '<option value="all">🌐 顯示全部</option>';
    let uniqueAttrs = [...new Set(currentNodes.map(n => n.tpl.attribute))];
    uniqueAttrs.forEach(attr => {
        let conf = v61Attributes[attr] || { label: attr };
        html += `<option value="${attr}">${conf.label}</option>`;
    });
    select.innerHTML = html;
    select.value = uniqueAttrs.includes(currentVal) ? currentVal : 'all';
}

function getCanvasEventCoords(e) {
    let canvas = document.getElementById('resultCanvas');
    let rect = canvas.getBoundingClientRect();
    let clientX = e.clientX - rect.left;
    let clientY = e.clientY - rect.top;
    return {
        x: Math.round(clientX / currentZoom),
        y: Math.round(clientY / currentZoom)
    };
}

function findNodeAt(x, y) {
    let exactHit = currentNodes.findIndex(n => x >= n.x - 4 && x <= n.x + n.tw + 4 && y >= n.y - 4 && y <= n.y + n.th + 4);
    if (exactHit !== -1) return exactHit;

    let closestIdx = -1;
    let minDst = 20;
    currentNodes.forEach((n, idx) => {
        let cx = n.x + n.tw / 2;
        let cy = n.y + n.th / 2;
        let dst = Math.hypot(x - cx, y - cy);
        if (dst < minDst) {
            minDst = dst;
            closestIdx = idx;
        }
    });
    return closestIdx;
}

function onCanvasMouseDown(e) {
    if (e.button !== 0) return;
    let coords = getCanvasEventCoords(e);

    if (interactionMode === 'pan') {
        panState.isPanning = true;
        panState.startX = e.clientX - panState.panX;
        panState.startY = e.clientY - panState.panY;
        document.getElementById('canvasContainer').classList.add('panning');
    } else if (interactionMode === 'draw') {
        if (!mapImg) return;
        drawState.isDrawing = true;
        drawState.startX = coords.x;
        drawState.startY = coords.y;
        drawState.endX = coords.x;
        drawState.endY = coords.y;
        updateSelectionBoxUI();
    } else if (interactionMode === 'edit') {
        let hitIdx = findNodeAt(coords.x, coords.y);
        if (hitIdx !== -1) openNodeEditModal(hitIdx);
    } else if (interactionMode === 'delete') {
        let hitIdx = findNodeAt(coords.x, coords.y);
        if (hitIdx !== -1) {
            selectedDeleteNodeIndex = hitIdx;
            openDeleteModal(hitIdx);
        }
    }
}

function onCanvasMouseMove(e) {
    let coords = getCanvasEventCoords(e);
    if (interactionMode === 'pan' && panState.isPanning) {
        panState.panX = e.clientX - panState.startX;
        panState.panY = e.clientY - panState.startY;
        updateCanvasTransform();
    } else if (interactionMode === 'draw' && drawState.isDrawing) {
        drawState.endX = coords.x;
        drawState.endY = coords.y;
        updateSelectionBoxUI();
    } else if (interactionMode === 'edit' || interactionMode === 'delete') {
        let prevHover = hoveredNodeIndex;
        hoveredNodeIndex = findNodeAt(coords.x, coords.y);
        if (prevHover !== hoveredNodeIndex) drawCanvas();
    }
}

function onCanvasMouseUp(e) {
    if (interactionMode === 'pan' && panState.isPanning) {
        panState.isPanning = false;
        document.getElementById('canvasContainer').classList.remove('panning');
    } else if (interactionMode === 'draw' && drawState.isDrawing) {
        drawState.isDrawing = false;
        document.getElementById('selectionBox').style.display = 'none';

        let x = Math.min(drawState.startX, drawState.endX);
        let y = Math.min(drawState.startY, drawState.endY);
        let w = Math.abs(drawState.endX - drawState.startX);
        let h = Math.abs(drawState.endY - drawState.startY);

        if (w < 5 || h < 5) {
            w = templateLibrary.length > 0 ? templateLibrary[0].width : 24;
            h = templateLibrary.length > 0 ? templateLibrary[0].height : 24;
            x -= w / 2;
            y -= h / 2;
        }

        openAddModalWithTop3(x, y, w, h);
    }
}

function updateSelectionBoxUI() {
    let box = document.getElementById('selectionBox');
    let x = Math.min(drawState.startX, drawState.endX) * currentZoom;
    let y = Math.min(drawState.startY, drawState.endY) * currentZoom;
    let w = Math.abs(drawState.endX - drawState.startX) * currentZoom;
    let h = Math.abs(drawState.endY - drawState.startY) * currentZoom;

    box.style.left = x + 'px';
    box.style.top = y + 'px';
    box.style.width = w + 'px';
    box.style.height = h + 'px';
    box.style.display = 'block';
}

function findTop3MatchingTemplates(cropCanvas) {
    if (templateLibrary.length === 0) return [];
    let tw_c = cropCanvas.width;
    let th_c = cropCanvas.height;
    let cropCtx = cropCanvas.getContext('2d');
    let sampleData = cropCtx.getImageData(0, 0, tw_c, th_c).data;

    let results = [];
    templateLibrary.forEach(tpl => {
        let tw = tpl.width;
        let th_h = tpl.height;
        let tData = tpl.data;

        let tempC = document.createElement('canvas');
        tempC.width = tw; tempC.height = th_h;
        let tempCtx = tempC.getContext('2d');
        tempCtx.drawImage(cropCanvas, 0, 0, tw, th_h);
        let resizedSampleData = tempCtx.getImageData(0, 0, tw, th_h).data;

        let totalDiff = 0, sampleCount = 0;
        for (let ty = 0; ty < th_h; ty += 2) {
            for (let tx = 0; tx < tw; tx += 2) {
                let idx = (ty * tw + tx) * 4;
                totalDiff += (Math.abs(resizedSampleData[idx] - tData[idx]) + Math.abs(resizedSampleData[idx+1] - tData[idx+1]) + Math.abs(resizedSampleData[idx+2] - tData[idx+2])) / 3;
                sampleCount++;
            }
        }
        let similarity = 1 - ((totalDiff / sampleCount) / 255);
        if (similarity >= 0.60) {
            results.push({ template: tpl, similarity: similarity });
        }
    });

    results.sort((a, b) => b.similarity - a.similarity);
    return results.slice(0, 3);
}

function openAddModalWithTop3(x, y, w, h) {
    pendingNewNode = { x, y, tw: w, th: h };
    
    let cropCanvas = document.getElementById('addCropCanvas');
    let cropCtx = cropCanvas.getContext('2d');
    cropCanvas.width = Math.max(w, 20);
    cropCanvas.height = Math.max(h, 20);
    cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
    
    if (mapImg) {
        cropCtx.drawImage(mapImg, x, y, w, h, 0, 0, cropCanvas.width, cropCanvas.height);
    }

    let top3 = findTop3MatchingTemplates(cropCanvas);
    let container = document.getElementById('candidateListContainer');
    container.innerHTML = '';

    if (top3.length === 0) {
        selectedTemplateCandidate = { attribute: "normal", name: "車站" };
        container.innerHTML = `<div style="padding: 10px; color: #facc15; font-size: calc(var(--base-font-size) * 0.85);">⚠️ 未達 0.6 相似度門檻，預設為：<b>🟣 車站</b></div>`;
    } else {
        selectedTemplateCandidate = top3[0].template;
        top3.forEach((item, index) => {
            let tpl = item.template;
            let attrConf = v61Attributes[tpl.attribute] || { label: tpl.attribute, color: "#8e44ad" };
            let isSelected = (index === 0);

            let card = document.createElement('div');
            card.className = `candidate-card ${isSelected ? 'selected' : ''}`;
            card.innerHTML = `
                <span class="color-badge" style="background: ${attrConf.color}; width: 14px; height: 14px;"></span>
                <img src="${tpl.img.src}" style="width: 24px; height: 24px; object-fit: contain; background:#fff; border-radius:3px;">
                <div style="flex:1;">
                    <div style="font-weight:bold; font-size:calc(var(--base-font-size)*0.85);">${attrConf.label} (${tpl.name})</div>
                    <div style="font-size:calc(var(--base-font-size)*0.75); color:#34d399;">相似度: ${(item.similarity * 100).toFixed(1)}%</div>
                </div>
                <span style="font-size:calc(var(--base-font-size)*0.8); font-weight:bold; color:${isSelected ? '#f59e0b' : '#64748b'};">${isSelected ? '✓ 已選取' : '選擇'}</span>
            `;

            card.onclick = function() {
                document.querySelectorAll('.candidate-card').forEach(c => {
                    c.classList.remove('selected');
                    c.querySelector('span:last-child').innerText = '選擇';
                    c.querySelector('span:last-child').style.color = '#64748b';
                });
                card.classList.add('selected');
                card.querySelector('span:last-child').innerText = '✓ 已選取';
                card.querySelector('span:last-child').style.color = '#f59e0b';
                selectedTemplateCandidate = tpl;
            };

            container.appendChild(card);
        });
    }

    let targetGx = 0, targetGy = 0;
    if (currentNodes.length > 0) {
        let cx = x + w / 2;
        let cy = y + h / 2;
        let closestNode = null;
        let minDistance = Infinity;

        currentNodes.forEach(n => {
            let ncx = n.x + n.tw / 2;
            let ncy = n.y + n.th / 2;
            let dist = Math.hypot(cx - ncx, cy - ncy);
            if (dist < minDistance) {
                minDistance = dist;
                closestNode = n;
            }
        });

        if (closestNode) {
            let dx = cx - (closestNode.x + closestNode.tw / 2);
            let dy = cy - (closestNode.y + closestNode.th / 2);

            if (Math.abs(dx) > Math.abs(dy)) {
                targetGx = closestNode.gx + (dx > 0 ? 1 : -1);
                targetGy = closestNode.gy;
            } else {
                targetGx = closestNode.gx;
                targetGy = closestNode.gy + (dy < 0 ? 1 : -1);
            }
        }
    }

    document.getElementById('newNodeGxModal').value = targetGx;
    document.getElementById('newNodeGyModal').value = targetGy;
    document.getElementById('addNodeModal').style.display = 'flex';
}

            if (!response.ok) throw new Error(`找不到檔案: ${filename}`);

function drawCanvas() {
    if (!mapImg) return;
    let canvas = document.getElementById('resultCanvas');
    canvas.width = mapImg.width;
    canvas.height = mapImg.height;
    let ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(mapImg, 0, 0);

    let showBox = document.getElementById('layerBox').checked;
    let showAttr = document.getElementById('layerAttr').checked;
    let showCoord = document.getElementById('layerCoord').checked;
    let filterVal = document.getElementById('layerFilterSelect').value;

    currentNodes.forEach((n, idx) => {
        if (filterVal !== 'all' && n.tpl.attribute !== filterVal) return;

        let attrConf = v61Attributes[n.tpl.attribute] || { color: "#8e44ad", label: n.tpl.attribute };
        let isHoveredForDelete = ((interactionMode === 'delete' || interactionMode === 'edit') && idx === hoveredNodeIndex);

        if (showBox || isHoveredForDelete) {
            ctx.lineWidth = 3;
            ctx.strokeStyle = (interactionMode === 'delete') ? "#ef4444" : (interactionMode === 'edit' ? "#f59e0b" : attrConf.color);
            if (isHoveredForDelete) ctx.setLineDash([6, 4]);
            else ctx.setLineDash([]);
            ctx.strokeRect(n.x, n.y, n.tw, n.th);
            ctx.setLineDash([]);
        }

        if (showAttr) {
            let displayText = n.label ? `${n.label}` : n.tpl.attribute;
            ctx.fillStyle = attrConf.color;
            ctx.fillRect(n.x, n.y - 18, ctx.measureText(displayText).width + 10, 16);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 11px sans-serif";
            ctx.fillText(displayText, n.x + 5, n.y - 6);
        }

        if (showCoord) {
            let coordText = `(${n.gx},${n.gy})`;
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            ctx.fillRect(n.x, n.y + n.th + 2, ctx.measureText(coordText).width + 8, 16);
            ctx.fillStyle = "#facc15";
            ctx.font = "bold 12px monospace";
            ctx.fillText(coordText, n.x + 4, n.y + n.th + 14);
        }
    });
}

document.getElementById('matchBtn').addEventListener('click', function() {
    if (!mapImg || templateLibrary.length === 0) {
        document.getElementById('result').innerHTML = "⚠️ 請先上傳大地圖並選擇/匯入至少一個圖庫！";
        return;
    }
    document.getElementById('result').innerText = `🔄 正在進行圖塊掃描與 Y 軸向上網格編碼...`;

    setTimeout(() => {
        let mapCanvas = document.createElement('canvas');
        mapCanvas.width = mapImg.width; mapCanvas.height = mapImg.height;
        let mapCtx = mapCanvas.getContext('2d');
        mapCtx.drawImage(mapImg, 0, 0);
        let mapData = mapCtx.getImageData(0, 0, mapCanvas.width, mapCanvas.height).data;

        let mw = mapImg.width, mh = mapImg.height;
        let allMatches = [];

        templateLibrary.forEach(tpl => {
            let tw = tpl.width, th = tpl.height, tData = tpl.data;
            let step = Math.max(1, Math.floor(tw / 4));

            for (let y = 0; y <= mh - th; y += step) {
                for (let x = 0; x <= mw - tw; x += step) {
                    let totalDiff = 0, sampleCount = 0;
                    for (let ty = 0; ty < th; ty += 2) {
                        for (let tx = 0; tx < tw; tx += 2) {
                            let mIdx = ((y + ty) * mw + (x + tx)) * 4;
                            let tIdx = (ty * tw + tx) * 4;
                            totalDiff += (Math.abs(mapData[mIdx] - tData[tIdx]) + Math.abs(mapData[mIdx+1] - tData[tIdx+1]) + Math.abs(mapData[mIdx+2] - tData[tIdx+2])) / 3;
                            sampleCount++;
                        }
                    }
                    let similarity = 1 - ((totalDiff / sampleCount) / 255);
                    let thresholdVal = tpl.threshold !== undefined ? tpl.threshold : 0.7;
                    if (similarity >= thresholdVal) {
                        allMatches.push({ x, y, tw, th, similarity, tpl });
                    }
                }
            }
        });

        allMatches.sort((a, b) => b.similarity - a.similarity);
        let nodes = [];
        allMatches.forEach(m => {
            let isOverlap = nodes.some(n => Math.abs(n.x - m.x) < m.tw * 0.8 && Math.abs(n.y - m.y) < m.th * 0.8);
            if (!isOverlap) {
                nodes.push({ x: m.x, y: m.y, tw: m.tw, th: m.th, tpl: m.tpl, gx: null, gy: null, visited: false, label: "", jpname: "" });
            }
        });

        if (nodes.length === 0) {
            document.getElementById('result').innerHTML = "⚠️ 找不到任何符合的圖庫，請調降門檻值。";
            return;
        }

        nodes.sort((a, b) => (a.x - a.y) - (b.x - b.y));
        let originNode = nodes[0];
        originNode.gx = 0; originNode.gy = 0; originNode.visited = true;

        let gridUnit = originNode.tw * 1.1;
        let queue = [originNode];

        while (queue.length > 0) {
            let current = queue.shift();
            nodes.forEach(neighbor => {
                if (neighbor.visited) return;
                let dx = neighbor.x - current.x;
                let pixelDy = neighbor.y - current.y; 
                let absDx = Math.abs(dx), absDy = Math.abs(pixelDy);

                if ((absDy < gridUnit * 0.5) && (absDx >= gridUnit * 0.7 && absDx <= gridUnit * 2.5)) {
                    neighbor.gx = current.gx + (dx > 0 ? 1 : -1);
                    neighbor.gy = current.gy;
                    neighbor.visited = true;
                    queue.push(neighbor);
                } 
                else if ((absDx < gridUnit * 0.5) && (absDy >= gridUnit * 0.7 && absDy <= gridUnit * 2.5)) {
                    neighbor.gx = current.gx;
                    neighbor.gy = current.gy + (pixelDy < 0 ? 1 : -1); 
                    neighbor.visited = true;
                    queue.push(neighbor);
                }
            });
        }

        nodes.forEach(n => {
            if (n.gx === null || n.gy === null) {
                n.gx = Math.round((n.x - originNode.x) / gridUnit);
                n.gy = Math.round((originNode.y - n.y) / gridUnit); 
            }
        });

        currentNodes = nodes;
        blockedConnections = [];
        updateFilterOptions();
        drawCanvas();
        document.getElementById('result').innerHTML = `🎯 辨識完成！共識別 ${nodes.length} 個標準網格節點。`;
    }, 50);
});

function getGeneratedJSONString() {
    let v71Export = {
        region: regionNameVal,
        nodes: currentNodes.map(n => ({
            x: n.gx,
            y: n.gy,
            type: n.tpl.attribute,
            label: n.label || "",
            jpname: n.jpname || ""
        })),
        blocked: blockedConnections,
        oneway: [],
        shortcuts: []
    };
    return JSON.stringify(v71Export, null, 2);
}

function syncRegionName(val) { regionNameVal = val; }

function clearResults() {
    currentNodes = [];
    blockedConnections = [];
    updateFilterOptions();
    if (mapImg) drawCanvas();
    else {
        let canvas = document.getElementById('resultCanvas');
        let ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    document.getElementById('result').innerHTML = "✨ 已清除辨識結果。";
}

function resetAllWebsite() {
    mapImg = null;
    templateLibrary = [];
    currentNodes = [];
    blockedConnections = [];
    regionNameVal = "Okinawa";
    currentZoom = 1.0;
    panState.panX = 0;
    panState.panY = 0;

    document.getElementById('uploadMap').value = '';
    document.getElementById('uploadTemplates').value = '';
    document.getElementById('mapFileName').innerText = '尚未選擇檔案';
    document.getElementById('mapFileName').className = 'file-status-text';
    document.getElementById('templatesFileName').innerText = '尚未選擇檔案';
    document.getElementById('templatesFileName').className = 'file-status-text';
    document.getElementById('regionName').value = 'Okinawa';
    document.getElementById('presetLibrarySelect').value = '';
    document.getElementById('zoomRange').value = '1.0';
    document.getElementById('zoomVal').innerText = '100%';
    switchInteractionMode('pan');
    
    renderTemplateList();
    updateFilterOptions();
    
    let canvas = document.getElementById('resultCanvas');
    canvas.width = 300; canvas.height = 150;
    let ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    updateCanvasTransform();

    document.getElementById('result').innerHTML = "✨ 初始化完成，請開始上傳大地圖與圖案";
}

let copyTimeout = null;
function copyJson() {
    let jsonStr = getGeneratedJSONString();
    if (!currentNodes || currentNodes.length === 0) {
        document.getElementById('result').innerHTML = "⚠️ 尚無辨識數據可供複製！";
        return;
    }
    navigator.clipboard.writeText(jsonStr).then(() => showCopyTip()).catch(err => {
        let textarea = document.createElement('textarea');
        textarea.value = jsonStr;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
        showCopyTip();
    });
}

function downloadJsonFile() {
    let jsonStr = getGeneratedJSONString();
    if (!currentNodes || currentNodes.length === 0) {
        document.getElementById('result').innerHTML = "⚠️ 尚無辨識數據可供下載！";
        return;
    }
    let fileName = (regionNameVal ? regionNameVal.trim() : "map_data") + ".json";
    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonStr);
    let anchor = document.createElement('a');
    anchor.setAttribute("href", dataStr);
    anchor.setAttribute("download", fileName);
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    document.getElementById('result').innerHTML = "💾 JSON 檔案已下載！";
}

function showCopyTip() {
    let tip = document.getElementById('copyTip');
    tip.classList.add('show');
    document.getElementById('result').innerHTML = "📋 JSON 資料已成功複製到剪貼簿！";
    if (copyTimeout) clearTimeout(copyTimeout);
    copyTimeout = setTimeout(() => tip.classList.remove('show'), 2000);
}
</script>
